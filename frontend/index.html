<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Salon Beauty - Panel Rezerwacji</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #d63384; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #d63384; color: white; }
        .refresh-btn { background: #d63384; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        .service-form { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
        .service-form input, .appointment-form input, .appointment-form select { padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .service-form button { background: #198754; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 5px; }
        .appointment-form { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
        .appointment-form button { background: #0d6efd; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 5px; }
        .field-group { display: flex; flex-direction: column; gap: 4px; }
        .field-error { min-height: 16px; color: #dc3545; font-size: 12px; }
        .invalid-field { border-color: #dc3545 !important; outline: none; }
        .service-form input:invalid,
        .appointment-form input:invalid,
        .appointment-form select:invalid {
            border-color: #dc3545 !important;
            box-shadow: 0 0 0 1px #dc3545;
        }
        .service-form input:invalid:focus,
        .appointment-form input:invalid:focus,
        .appointment-form select:invalid:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(220, 53, 69, 0.35);
        }
        .edit-btn { background: #ffc107; color: black; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 90%; max-width: 500px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { margin: 0; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; }
        .edit-form { display: flex; flex-direction: column; gap: 12px; }
        .edit-form input, .edit-form select { padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .edit-form button { background: #0d6efd; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; }
        .login-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .login-form input { padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .login-form button { background: #6c757d; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 5px; }
        .login-form .user-info { margin-left: auto; font-size: 14px; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>

<div class="container">
    <h1>💅 System Rezerwacji Salonu</h1>
    
    <div class="login-form" id="authSection">
        <input type="text" id="username" placeholder="Nazwa użytkownika" value="admin">
        <input type="password" id="password" placeholder="Hasło" value="admin123">
        <button onclick="login()">Zaloguj</button>
        <div class="user-info" id="userInfo" style="display: none;">
            Zalogowany jako: <strong id="currentUser"></strong>
            <button class="logout-btn" onclick="logout()">Wyloguj</button>
        </div>
    </div>

    <div id="authMessage" style="margin-top: 8px; color: #6c757d; font-size: 14px;"></div>

    <button class="refresh-btn" onclick="loadData()">Odśwież dane</button>

    <h2>Dostępne Usługi</h2>
    <form id="addServiceForm" class="service-form">
        <div class="field-group">
            <input type="text" id="serviceName" placeholder="Nazwa usługi" required>
            <small id="serviceNameError" class="field-error"></small>
        </div>
        <div class="field-group">
            <input type="number" id="servicePrice" placeholder="Cena" min="0" step="0.01" required>
            <small id="servicePriceError" class="field-error"></small>
        </div>
        <div class="field-group">
            <input type="number" id="serviceDuration" placeholder="Czas (min)" min="1" step="1" required>
            <small id="serviceDurationError" class="field-error"></small>
        </div>
        <button type="submit">Dodaj usługę</button>
    </form>

    <table id="servicesTable">
        <thead>
            <tr>
                <th>ID</th><th>Nazwa</th><th>Cena</th><th>Czas (min)</th><th id="serviceActionsHeader">Akcje</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="editServiceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edytuj usługę</h2>
                <button class="modal-close" onclick="closeEditServiceModal()">&times;</button>
            </div>
            <form id="editServiceForm" class="edit-form">
                <input type="hidden" id="editServiceId">
                <input type="text" id="editServiceName" placeholder="Nazwa usługi" required>
                <small id="editServiceNameError" class="field-error"></small>
                <input type="number" id="editServicePrice" placeholder="Cena" min="0" step="0.01" required>
                <small id="editServicePriceError" class="field-error"></small>
                <input type="number" id="editServiceDuration" placeholder="Czas (min)" min="1" step="1" required>
                <small id="editServiceDurationError" class="field-error"></small>
                <button type="submit">Zaktualizuj</button>
            </form>
        </div>
    </div>

    <h2>Zaplanowane Wizyty</h2>
    <form id="addAppointmentForm" class="appointment-form">
        <div class="field-group">
            <input type="text" id="clientName" placeholder="Imię klienta" required>
            <small id="clientNameError" class="field-error"></small>
        </div>
        <div class="field-group">
            <input type="datetime-local" id="appointmentTime" required>
            <small id="appointmentTimeError" class="field-error"></small>
        </div>
        <div class="field-group">
            <select id="appointmentService" required>
                <option value="">Wybierz usługę</option>
            </select>
            <small id="appointmentServiceError" class="field-error"></small>
        </div>
        <div class="field-group">
            <input type="text" id="appointmentStatus" placeholder="Status" value="NEW" required>
            <small id="appointmentStatusError" class="field-error"></small>
        </div>
        <button type="submit">Dodaj wizytę</button>
    </form>

    <table id="appointmentsTable">
        <thead>
            <tr>
                <th>Klient</th><th>Data</th><th>Usługa</th><th>Status</th><th id="appointmentActionsHeader">Akcje</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="editAppointmentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edytuj wizytę</h2>
                <button class="modal-close" onclick="closeEditAppointmentModal()">&times;</button>
            </div>
            <form id="editAppointmentForm" class="edit-form">
                <input type="hidden" id="editAppointmentId">
                <input type="text" id="editClientName" placeholder="Imię klienta" required>
                <small id="editClientNameError" class="field-error"></small>
                <input type="datetime-local" id="editAppointmentTime" required>
                <small id="editAppointmentTimeError" class="field-error"></small>
                <select id="editAppointmentService" required>
                    <option value="">Wybierz usługę</option>
                </select>
                <small id="editAppointmentServiceError" class="field-error"></small>
                <input type="text" id="editAppointmentStatus" placeholder="Status" required>
                <small id="editAppointmentStatusError" class="field-error"></small>
                <button type="submit">Zaktualizuj</button>
            </form>
        </div>
    </div>
</div>

<script>
    // ===== Authentication Functions =====
    function getAuthHeader() {
        const credentials = localStorage.getItem('auth_credentials');
        if (!credentials) {
            return {};
        }
        return {
            'Authorization': 'Basic ' + credentials
        };
    }

    function getCurrentRole() {
        return localStorage.getItem('role');
    }

    function canModifyData() {
        const role = getCurrentRole();
        return role === 'ADMIN' || role === 'OWNER' || role === 'STAFF';
    }

    function updatePermissionUI() {
        const canWrite = canModifyData();
        const role = getCurrentRole();

        document.querySelector('#addServiceForm').style.display = canWrite ? 'flex' : 'none';
        document.querySelector('#addAppointmentForm').style.display = canWrite ? 'flex' : 'none';
        document.querySelector('#serviceActionsHeader').style.display = canWrite ? 'table-cell' : 'none';
        document.querySelector('#appointmentActionsHeader').style.display = canWrite ? 'table-cell' : 'none';

        const authMessage = document.querySelector('#authMessage');
        if (!role) {
            authMessage.textContent = 'Tryb publiczny: przeglądanie bez logowania.';
            return;
        }

        if (!canWrite) {
            authMessage.textContent = `Rola ${role}: tylko podgląd (bez dodawania, edycji i usuwania).`;
            return;
        }

        authMessage.textContent = `Rola ${role}: pełna edycja danych.`;
    }

    async function fetchCurrentUser(credentials) {
        let response;
        try {
            response = await fetch('http://localhost:8081/api/auth/me', {
                headers: {
                    'Authorization': 'Basic ' + credentials
                }
            });
        } catch (error) {
            return null;
        }

        if (!response.ok) {
            return null;
        }

        return response.json();
    }

    async function login() {
        const username = document.querySelector('#username').value;
        const password = document.querySelector('#password').value;

        if (!username || !password) {
            alert('Wpisz nazwę użytkownika i hasło.');
            return;
        }

        const credentials = btoa(username + ':' + password);
        const me = await fetchCurrentUser(credentials);
        if (!me) {
            alert('Nie udało się zalogować. Sprawdź login/hasło lub połączenie z API.');
            return;
        }

        localStorage.setItem('auth_credentials', credentials);
        localStorage.setItem('username', me.username);
        localStorage.setItem('role', me.role);

        document.querySelector('#userInfo').style.display = 'block';
        document.querySelector('#currentUser').textContent = `${me.username} (${me.role})`;
        document.querySelector('#authSection').style.display = 'flex';

        updatePermissionUI();
        await loadData();
    }

    function logout() {
        localStorage.removeItem('auth_credentials');
        localStorage.removeItem('username');
        localStorage.removeItem('role');

        document.querySelector('#userInfo').style.display = 'none';
        document.querySelector('#username').value = '';
        document.querySelector('#password').value = '';

        document.querySelector('#servicesTable tbody').innerHTML = '';
        document.querySelector('#appointmentsTable tbody').innerHTML = '';
        updatePermissionUI();
        loadData();
    }

    async function checkAuthStatus() {
        const username = localStorage.getItem('username');
        const credentials = localStorage.getItem('auth_credentials');
        if (username && credentials) {
            const me = await fetchCurrentUser(credentials);
            if (!me) {
                logout();
                return;
            }

            localStorage.setItem('username', me.username);
            localStorage.setItem('role', me.role);
            document.querySelector('#userInfo').style.display = 'block';
            document.querySelector('#currentUser').textContent = `${me.username} (${me.role})`;
        }

        updatePermissionUI();
        await loadData();
    }

    async function handleAuthResponse(response) {
        if (response.status === 401) {
            alert('Sesja wygasła lub dane logowania są niepoprawne. Zaloguj się ponownie.');
            logout();
            return true;
        }

        if (response.status === 403) {
            alert('Brak uprawnień do tej operacji.');
            return true;
        }

        return false;
    }

    // ===== Utility Functions =====
    function clearFieldErrors(mapping) {
        Object.entries(mapping).forEach(([fieldName, config]) => {
            const errorId = config.errorId;
            const errorNode = document.querySelector(`#${errorId}`);
            if (errorNode) {
                errorNode.textContent = '';
            }

            const inputNode = document.querySelector(config.inputSelector);
            if (inputNode) {
                inputNode.classList.remove('invalid-field');
            }
        });
    }

    function showFieldErrors(errors, mapping) {
        Object.entries(mapping).forEach(([fieldName, config]) => {
            const errorNode = document.querySelector(`#${config.errorId}`);
            if (!errorNode) {
                return;
            }

            const fieldMessage = errors[fieldName] || '';
            errorNode.textContent = fieldMessage;

            const inputNode = document.querySelector(config.inputSelector);
            if (!inputNode) {
                return;
            }

            if (fieldMessage) {
                inputNode.classList.add('invalid-field');
            } else {
                inputNode.classList.remove('invalid-field');
            }
        });
    }

    async function parseErrorResponse(response) {
        return response.json().catch(() => null);
    }

    // ===== Load Data =====
    async function loadData() {
        const canWrite = canModifyData();

        // Get Services
        const resServices = await fetch('http://localhost:8081/api/services');
        const services = await resServices.json();
        const sBody = document.querySelector('#servicesTable tbody');
        const serviceSelect = document.querySelector('#appointmentService');
        const editServiceSelect = document.querySelector('#editAppointmentService');
        
        sBody.innerHTML = services.map(s => `
            <tr>
                <td>${s.id}</td>
                <td>${s.name}</td>
                <td>${s.price} zł</td>
                <td>${s.duration}</td>
                <td>${canWrite ? `<button type="button" class="edit-service-btn" data-id="${s.id}" data-name="${s.name}" data-price="${s.price}" data-duration="${s.duration}" style="background: #ffc107; color: black; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;">Edytuj</button>` : ''}</td>
            </tr>
        `).join('');
        
        const servicesOptions = `
            <option value="">Wybierz usługę</option>
            ${services.map(s => `<option value="${s.id}">${s.name} (${s.duration} min)</option>`).join('')}
        `;
        serviceSelect.innerHTML = servicesOptions;
        editServiceSelect.innerHTML = servicesOptions;

        // Get Appointments
        const resApps = await fetch('http://localhost:8081/api/appointments');
        const apps = await resApps.json();
        const aBody = document.querySelector('#appointmentsTable tbody');
        aBody.innerHTML = apps.map(a => `
            <tr>
                <td>${a.clientName}</td>
                <td>${new Date(a.appointmentTime).toLocaleString()}</td>
                <td>${a.service ? a.service.name : 'Brak'}</td>
                <td>${a.status}</td>
                <td>${canWrite ? `<button type="button" class="edit-appointment-btn" data-id="${a.id}" data-client="${a.clientName}" data-time="${a.appointmentTime}" data-service="${a.service?.id || ''}" data-status="${a.status}" style="background: #ffc107; color: black; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; margin-right: 5px;">Edytuj</button><button type="button" class="delete-btn" data-id="${a.id}" style="background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;">Usuń</button>` : ''}</td>
            </tr>
        `).join('');
    }

    // ===== Modal Functions =====
    function closeEditServiceModal() {
        document.querySelector('#editServiceModal').classList.remove('show');
    }

    function closeEditAppointmentModal() {
        document.querySelector('#editAppointmentModal').classList.remove('show');
    }

    // ===== Add Service Form =====
    document.querySelector('#addServiceForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        if (!canModifyData()) {
            alert('Brak uprawnień do dodawania usług.');
            return;
        }

        const serviceErrorMapping = {
            name: { errorId: 'serviceNameError', inputSelector: '#serviceName' },
            price: { errorId: 'servicePriceError', inputSelector: '#servicePrice' },
            duration: { errorId: 'serviceDurationError', inputSelector: '#serviceDuration' }
        };
        clearFieldErrors(serviceErrorMapping);

        const name = document.querySelector('#serviceName').value.trim();
        const price = Number(document.querySelector('#servicePrice').value);
        const duration = Number(document.querySelector('#serviceDuration').value);

        if (!name || Number.isNaN(price) || Number.isNaN(duration)) {
            alert('Uzupełnij poprawnie wszystkie pola usługi.');
            return;
        }

        const authHeaders = getAuthHeader();
        const response = await fetch('http://localhost:8081/api/services', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                ...authHeaders
            },
            body: JSON.stringify({
                name,
                price,
                duration,
                description: ''
            })
        });

        if (!response.ok) {
            const errorBody = await parseErrorResponse(response);
            if (response.status === 400 && errorBody && errorBody.errors) {
                showFieldErrors(errorBody.errors, serviceErrorMapping);
                return;
            }
            if (await handleAuthResponse(response)) {
                return;
            }

            alert('Nie udało się dodać usługi.');
            return;
        }

        event.target.reset();
        loadData();
    });

    // ===== Edit Service Modal =====
    document.querySelector('#servicesTable tbody').addEventListener('click', async (event) => {
        const editBtn = event.target.closest('.edit-service-btn');
        if (!editBtn) {
            return;
        }

        if (!canModifyData()) {
            alert('Brak uprawnień do edycji usług.');
            return;
        }

        const id = editBtn.dataset.id;
        const name = editBtn.dataset.name;
        const price = editBtn.dataset.price;
        const duration = editBtn.dataset.duration;

        document.querySelector('#editServiceId').value = id;
        document.querySelector('#editServiceName').value = name;
        document.querySelector('#editServicePrice').value = price;
        document.querySelector('#editServiceDuration').value = duration;

        document.querySelector('#editServiceModal').classList.add('show');
    });

    // ===== Edit Service Form =====
    document.querySelector('#editServiceForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        if (!canModifyData()) {
            alert('Brak uprawnień do edycji usług.');
            return;
        }

        const serviceErrorMapping = {
            name: { errorId: 'editServiceNameError', inputSelector: '#editServiceName' },
            price: { errorId: 'editServicePriceError', inputSelector: '#editServicePrice' },
            duration: { errorId: 'editServiceDurationError', inputSelector: '#editServiceDuration' }
        };
        clearFieldErrors(serviceErrorMapping);

        const id = document.querySelector('#editServiceId').value;
        const name = document.querySelector('#editServiceName').value.trim();
        const price = Number(document.querySelector('#editServicePrice').value);
        const duration = Number(document.querySelector('#editServiceDuration').value);

        if (!name || Number.isNaN(price) || Number.isNaN(duration)) {
            alert('Uzupełnij poprawnie wszystkie pola usługi.');
            return;
        }

        const authHeaders = getAuthHeader();
        const response = await fetch(`http://localhost:8081/api/services/${id}`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                ...authHeaders
            },
            body: JSON.stringify({
                name,
                price,
                duration,
                description: ''
            })
        });

        if (!response.ok) {
            const errorBody = await parseErrorResponse(response);
            if (response.status === 400 && errorBody && errorBody.errors) {
                showFieldErrors(errorBody.errors, serviceErrorMapping);
                return;
            }
            if (await handleAuthResponse(response)) {
                return;
            }

            alert('Nie udało się zaktualizować usługi.');
            return;
        }

        closeEditServiceModal();
        loadData();
    });

    // ===== Add Appointment Form =====
    document.querySelector('#addAppointmentForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        if (!canModifyData()) {
            alert('Brak uprawnień do dodawania wizyt.');
            return;
        }

        const appointmentErrorMapping = {
            clientName: { errorId: 'clientNameError', inputSelector: '#clientName' },
            appointmentTime: { errorId: 'appointmentTimeError', inputSelector: '#appointmentTime' },
            serviceId: { errorId: 'appointmentServiceError', inputSelector: '#appointmentService' },
            status: { errorId: 'appointmentStatusError', inputSelector: '#appointmentStatus' }
        };
        clearFieldErrors(appointmentErrorMapping);

        const clientName = document.querySelector('#clientName').value.trim();
        const appointmentTime = document.querySelector('#appointmentTime').value;
        const serviceId = Number(document.querySelector('#appointmentService').value);
        const status = document.querySelector('#appointmentStatus').value.trim();

        if (!clientName || !appointmentTime || Number.isNaN(serviceId) || !status) {
            alert('Uzupełnij poprawnie wszystkie pola wizyty.');
            return;
        }

        const authHeaders = getAuthHeader();
        const response = await fetch('http://localhost:8081/api/appointments', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                ...authHeaders
            },
            body: JSON.stringify({
                clientName,
                appointmentTime,
                status,
                serviceId
            })
        });

        if (!response.ok) {
            const errorBody = await parseErrorResponse(response);
            if (response.status === 400 && errorBody && errorBody.errors) {
                showFieldErrors(errorBody.errors, appointmentErrorMapping);
                return;
            }
            if (await handleAuthResponse(response)) {
                return;
            }

            alert('Nie udało się dodać wizyty.');
            return;
        }

        event.target.reset();
        document.querySelector('#appointmentStatus').value = 'NEW';
        loadData();
    });

    // ===== Edit Appointment Modal =====
    document.querySelector('#appointmentsTable tbody').addEventListener('click', async (event) => {
        const editBtn = event.target.closest('.edit-appointment-btn');
        if (!editBtn) {
            return;
        }

        if (!canModifyData()) {
            alert('Brak uprawnień do edycji wizyt.');
            return;
        }

        const id = editBtn.dataset.id;
        const clientName = editBtn.dataset.client;
        const appointmentTime = editBtn.dataset.time;
        const serviceId = editBtn.dataset.service;
        const status = editBtn.dataset.status;

        document.querySelector('#editAppointmentId').value = id;
        document.querySelector('#editClientName').value = clientName;
        document.querySelector('#editAppointmentTime').value = appointmentTime;
        document.querySelector('#editAppointmentService').value = serviceId;
        document.querySelector('#editAppointmentStatus').value = status;

        document.querySelector('#editAppointmentModal').classList.add('show');
    });

    // ===== Edit Appointment Form =====
    document.querySelector('#editAppointmentForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        if (!canModifyData()) {
            alert('Brak uprawnień do edycji wizyt.');
            return;
        }

        const appointmentErrorMapping = {
            clientName: { errorId: 'editClientNameError', inputSelector: '#editClientName' },
            appointmentTime: { errorId: 'editAppointmentTimeError', inputSelector: '#editAppointmentTime' },
            serviceId: { errorId: 'editAppointmentServiceError', inputSelector: '#editAppointmentService' },
            status: { errorId: 'editAppointmentStatusError', inputSelector: '#editAppointmentStatus' }
        };
        clearFieldErrors(appointmentErrorMapping);

        const id = document.querySelector('#editAppointmentId').value;
        const clientName = document.querySelector('#editClientName').value.trim();
        const appointmentTime = document.querySelector('#editAppointmentTime').value;
        const serviceId = Number(document.querySelector('#editAppointmentService').value);
        const status = document.querySelector('#editAppointmentStatus').value.trim();

        if (!clientName || !appointmentTime || Number.isNaN(serviceId) || !status) {
            alert('Uzupełnij poprawnie wszystkie pola wizyty.');
            return;
        }

        const authHeaders = getAuthHeader();
        const response = await fetch(`http://localhost:8081/api/appointments/${id}`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                ...authHeaders
            },
            body: JSON.stringify({
                clientName,
                appointmentTime,
                status,
                serviceId
            })
        });

        if (!response.ok) {
            const errorBody = await parseErrorResponse(response);
            if (response.status === 400 && errorBody && errorBody.errors) {
                showFieldErrors(errorBody.errors, appointmentErrorMapping);
                return;
            }
            if (await handleAuthResponse(response)) {
                return;
            }

            alert('Nie udało się zaktualizować wizyty.');
            return;
        }

        closeEditAppointmentModal();
        loadData();
    });

    // ===== Delete Appointment =====
    document.querySelector('#appointmentsTable tbody').addEventListener('click', async (event) => {
        const deleteBtn = event.target.closest('.delete-btn');
        if (!deleteBtn) {
            return;
        }

        if (!canModifyData()) {
            alert('Brak uprawnień do usuwania wizyt.');
            return;
        }

        const id = deleteBtn.dataset.id;
        if (!id) {
            return;
        }

        if (!confirm('Na pewno chcesz usunąć tę wizytę?')) {
            return;
        }

        const authHeaders = getAuthHeader();
        const response = await fetch(`http://localhost:8081/api/appointments/${id}`, {
            method: 'DELETE',
            headers: authHeaders
        });

        if (!response.ok) {
            if (await handleAuthResponse(response)) {
                return;
            }
            alert('Nie udało się usunąć wizyty.');
            return;
        }

        loadData();
    });

    // ===== Modal Close =====
    document.addEventListener('click', (event) => {
        if (event.target.id === 'editServiceModal' && event.target.classList.contains('modal')) {
            closeEditServiceModal();
        }
        if (event.target.id === 'editAppointmentModal' && event.target.classList.contains('modal')) {
            closeEditAppointmentModal();
        }
    });

    // ===== Initialize =====
    checkAuthStatus();
</script>

</body>
</html>
